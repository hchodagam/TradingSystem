[project]
name = "tradingsystem"
version = "0.1.0"
description = "AI-assisted research and paper-trading engine for Indian equities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "exchange_calendars>=4.5",
    "scipy>=1.13",
    "python-dotenv>=1.0",
    "psutil>=5.9",
]

[project.scripts]
ts = "tradingsystem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingsystem"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
